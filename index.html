  <script>
    const DEFAULT_EXCEL_FILENAME = "O-PAS-Redfish-Profile-Master.xlsx";
    const TARGET_SHEET_NAME = "Profile";

    let isEditMode = false;
    let isPaneHidden = true;
    let currentViewMode = "tree_view";
    let selectedProfileFilter = "__ALL__";
    let selectedVersionScope = "__ALL__";
    let selectedCompareProfiles = [];
    let searchDebounceTimer = null;

    let codeRawText = "";
    let currentSearchQuery = "";
    let activeMatchIndex = 0;

    let filesState = [];
    let activeFileId = null;
    let isUpdatingFromTree = false;

    const ROW_HEIGHT = 30;
    let virtualRowsList = [];

    const RESOURCE_BLACKLIST = [
      'ActionInfo', 'Event', 'IPAddress', 'IPStaticAddress', 
      'IPGatewayStaticAddress', 'Payload', 'Identifier', 
      'AttributeRegistry', 'Common', 'Payload Annotations', 
      'MaintananceWindow', 'OperationApplyTimeSupport', 
      'PreferredApplyTime', 'Redundancy', 'Schedule', 'Settings'
    ];

    function showLoading(show = true, msg = "Processing Workbook...") {
      const el = document.getElementById('loading-overlay');
      document.getElementById('loading-message').textContent = msg;
      el.style.display = show ? 'flex' : 'none';
    }

    function simpleYamlDump(obj, indent = 0) {
      let str = '';
      const prefix = ' '.repeat(indent);
      for (const key in obj) {
        const val = obj[key];
        if (Array.isArray(val)) {
          str += `${prefix}${key}:\n`;
          val.forEach(item => {
            str += `${prefix}  - ${typeof item === 'object' ? JSON.stringify(item) : item}\n`;
          });
        } else if (typeof val === 'object' && val !== null) {
          str += `${prefix}${key}:\n` + simpleYamlDump(val, indent + 2);
        } else if (val === null || val === undefined || val === '') {
          str += `${prefix}${key}:\n`;
        } else {
          str += `${prefix}${key}: ${val}\n`;
        }
      }
      return str;
    }

    document.addEventListener("DOMContentLoaded", () => {
      initResizer();
      renderTabsUI();
      autoLoadDefaultExcelWorkbook();
    });

    async function autoLoadDefaultExcelWorkbook() {
  try {
    showLoading(true, `Loading ${DEFAULT_EXCEL_FILENAME}...`);
    
    // تحديد المسار تلقائياً بناءً على مكان الصفحة الحالي (يعمل محلياً وعلى GitHub Pages)
    const basePath = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
    const fileUrl = basePath + DEFAULT_EXCEL_FILENAME;

    const response = await fetch(fileUrl);
    if (!response.ok) {
      showLoading(false);
      return;
    }

    const buffer = await response.arrayBuffer();
    await parseAndOpenExcelBuffer(buffer, DEFAULT_EXCEL_FILENAME, TARGET_SHEET_NAME);
  } catch (err) {
    console.warn("Autoload default workbook skipped:", err);
  } finally {
    showLoading(false);
  }
}

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderCodeWithHighlights(text, query, activeIdx = 0) {
      const codeContainer = document.getElementById("code-output");
      const counter = document.getElementById("code-search-counter");

      if (!query || query.trim() === "") {
        codeContainer.textContent = text;
        counter.textContent = "";
        return;
      }

      const lowerText = text.toLowerCase();
      const lowerQuery = query.toLowerCase();
      const qLen = query.length;

      let matchPositions = [];
      let pos = lowerText.indexOf(lowerQuery);
      while (pos !== -1) {
        matchPositions.push(pos);
        pos = lowerText.indexOf(lowerQuery, pos + qLen);
      }

      const totalMatches = matchPositions.length;
      if (totalMatches === 0) {
        codeContainer.textContent = text;
        counter.textContent = "0/0";
        return;
      }

      activeMatchIndex = ((activeIdx % totalMatches) + totalMatches) % totalMatches;
      counter.textContent = `${activeMatchIndex + 1}/${totalMatches}`;

      let html = "";
      let lastPos = 0;

      matchPositions.forEach((matchStart, i) => {
        const isCurrent = (i === activeMatchIndex);
        html += escapeHtml(text.substring(lastPos, matchStart));
        html += `<mark class="code-output-mark ${isCurrent ? 'active-match' : ''}" id="code-mark-${i}">${escapeHtml(text.substring(matchStart, matchStart + qLen))}</mark>`;
        lastPos = matchStart + qLen;
      });

      html += escapeHtml(text.substring(lastPos));
      codeContainer.innerHTML = html;

      const activeMark = document.getElementById(`code-mark-${activeMatchIndex}`);
      if (activeMark) {
        activeMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function handleCodeSearchInput(val) {
      currentSearchQuery = val;
      activeMatchIndex = 0;
      renderCodeWithHighlights(codeRawText, currentSearchQuery, activeMatchIndex);
    }

    function handleCodeSearchKeydown(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        navigateCodeSearchMatch(e.shiftKey ? -1 : 1);
      }
    }

    function navigateCodeSearchMatch(direction) {
      if (!currentSearchQuery || currentSearchQuery.trim() === "") return;
      activeMatchIndex += direction;
      renderCodeWithHighlights(codeRawText, currentSearchQuery, activeMatchIndex);
    }

    function toggleDropdownMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById("file-action-dropdown");
      menu.classList.toggle("show");
    }

    function closeDropdownMenu() {
      const menu = document.getElementById("file-action-dropdown");
      if (menu) menu.classList.remove("show");
    }

    function toggleMultiSelectPopover(e) {
      e.stopPropagation();
      const popover = document.getElementById("compare-select-popover");
      popover.classList.toggle("show");
    }

    function closeMultiSelectPopover() {
      const popover = document.getElementById("compare-select-popover");
      if (popover) popover.classList.remove("show");
    }

    window.addEventListener("click", () => {
      closeDropdownMenu();
      closeMultiSelectPopover();
    });

    function toggleDarkTheme() {
      const isDark = document.body.classList.toggle("dark-theme");
      const icon = document.getElementById("theme-btn-icon");
      const label = document.getElementById("theme-btn-label");

      if (isDark) {
        icon.className = "fa-solid fa-sun";
        label.textContent = "Light";
      } else {
        icon.className = "fa-solid fa-moon";
        label.textContent = "Dark";
      }
    }

    function switchMainViewMode(mode) {
      currentViewMode = mode;
      
      const paneTitle = document.getElementById("tree-pane-title");
      const actionLinks = document.getElementById("tree-action-links");
      const treeCtrls = document.getElementById("tree-view-controls");
      const compareCtrls = document.getElementById("compare-view-controls");

      if (currentViewMode === "compare_view") {
        paneTitle.textContent = "Profile Comparison Matrix View";
        actionLinks.style.display = "none";
        treeCtrls.style.display = "none";
        compareCtrls.style.display = "flex";
        renderComparisonInTreePane();
      } else {
        paneTitle.textContent = "Tree Navigator View";
        actionLinks.style.display = "flex";
        treeCtrls.style.display = "flex";
        compareCtrls.style.display = "none";
        refreshVirtualTree();
      }
    }

    function isProfileKey(label) {
      const patternStr = document.getElementById("profile-pattern-regex")?.value || "OSM-.*";
      try {
        const regex = new RegExp(`^${patternStr}$`, "i");
        return regex.test(label);
      } catch (e) {
        return label.startsWith("OSM-");
      }
    }

    function detectProfilesInTree(nodes) {
      const detected = new Set();
      function scan(nodeList) {
        nodeList.forEach(node => {
          if (isProfileKey(node.label)) detected.add(node.label);
          if (node.children) scan(node.children);
        });
      }
      scan(nodes);
      return Array.from(detected);
    }

    function updateProfileDropdowns() {
      const file = getActiveFile();
      const detectedProfiles = file ? detectProfilesInTree(file.treeData) : [];

      const viewSelect = document.getElementById("view-profile-select");
      const popoverContainer = document.getElementById("multi-select-options-container");

      const currentVal = viewSelect.value || "__ALL__";
      viewSelect.innerHTML = `<option value="__ALL__">All</option>`;
      popoverContainer.innerHTML = "";

      if (detectedProfiles.length === 0) {
        selectedCompareProfiles = [];
        updateCompareButtonLabel();
        return;
      }

      detectedProfiles.forEach((prof) => {
        const optView = document.createElement("option");
        optView.value = prof;
        optView.textContent = prof;
        viewSelect.appendChild(optView);
      });

      if (selectedCompareProfiles.length === 0) {
        selectedCompareProfiles = detectedProfiles.slice(0, 2);
      } else {
        selectedCompareProfiles = selectedCompareProfiles.filter(p => detectedProfiles.includes(p));
        if (selectedCompareProfiles.length === 0) {
          selectedCompareProfiles = detectedProfiles.slice(0, 2);
        }
      }

      detectedProfiles.forEach(prof => {
        const row = document.createElement("label");
        row.className = "multi-select-option";
        const isChecked = selectedCompareProfiles.includes(prof);
        row.innerHTML = `
          <input type="checkbox" value="${prof}" ${isChecked ? 'checked' : ''} onchange="handleProfileCheckboxChange(this)">
          <span>${prof}</span>
        `;
        popoverContainer.appendChild(row);
      });

      updateCompareButtonLabel();
      viewSelect.value = detectedProfiles.includes(currentVal) ? currentVal : "__ALL__";
      selectedProfileFilter = viewSelect.value;
    }

    function handleProfileCheckboxChange(checkbox) {
      const val = checkbox.value;
      if (checkbox.checked) {
        if (!selectedCompareProfiles.includes(val)) selectedCompareProfiles.push(val);
      } else {
        selectedCompareProfiles = selectedCompareProfiles.filter(p => p !== val);
      }
      updateCompareButtonLabel();
      refreshView();
    }

    function updateCompareButtonLabel() {
      const label = document.getElementById("compare-select-label");
      if (selectedCompareProfiles.length === 0) {
        label.textContent = "Select Profiles";
      } else if (selectedCompareProfiles.length <= 2) {
        label.textContent = selectedCompareProfiles.join(" vs ");
      } else {
        label.textContent = `${selectedCompareProfiles.length} Profiles Selected`;
      }
    }

    function applyVersionScopeFilter(versionCode) {
      selectedVersionScope = versionCode;
      refreshView();
      if (!isPaneHidden) updateOutputFromTree();
    }

    function nodeMatchesVersionScope(node, scope) {
      if (!scope || scope === "__ALL__") return true;
      const vKey = scope.toLowerCase();

      function hasVersion(n) {
        if (n.opasVersions && n.opasVersions[vKey]) return true;
        if (n.children && n.children.length > 0) {
          return n.children.some(c => hasVersion(c));
        }
        return false;
      }

      return hasVersion(node);
    }

    function applyProfileFilter(profileName) {
      selectedProfileFilter = profileName;
      document.getElementById("search-input").value = "";
      
      const mode = document.getElementById("filter-behavior-mode").value;
      const file = getActiveFile();

      if (file) {
        if (mode === "tree_and_json") {
          syncTreeVisibilityWithProfile(file.treeData, profileName);
        } else if (mode === "unhide_all") {
          unhideAllProfilesInTree(file.treeData);
          document.getElementById("view-profile-select").value = "__ALL__";
          selectedProfileFilter = "__ALL__";
          document.getElementById("filter-behavior-mode").value = "tree_and_json";
        }
      }

      if (!isPaneHidden) updateOutputFromTree();
      refreshView();
    }

    function syncTreeVisibilityWithProfile(nodes, profile) {
      nodes.forEach(node => {
        if (isProfileKey(node.label)) {
          const matches = profile === "__ALL__" || node.label === profile;
          node.checked = matches;
          setSubtreeVisibility(node, matches);
        }
        if (node.children) syncTreeVisibilityWithProfile(node.children, profile);
      });
    }

    function unhideAllProfilesInTree(nodes) {
      nodes.forEach(node => {
        if (isProfileKey(node.label)) {
          node.checked = true;
          setSubtreeVisibility(node, true);
        }
        if (node.children) unhideAllProfilesInTree(node.children);
      });
    }

    function flattenVisibleNodes(nodes, profileFilter, searchTerm = "", versionScope = "__ALL__", currentDepth = 0) {
      let rows = [];

      nodes.forEach(node => {
        if (isProfileKey(node.label) && profileFilter !== "__ALL__" && node.label !== profileFilter) {
          return;
        }

        if (!nodeMatchesVersionScope(node, versionScope)) {
          return;
        }

        const hasChildren = node.children && node.children.length > 0;
        let displayLabel = node.label;
        let displayVal = node.value;
        let displayLoc = node.excelLoc;
        let targetId = node.id;
        let effectiveChildren = node.children || [];

        if (hasChildren && profileFilter !== "__ALL__") {
          const matchingProfileChild = node.children.find(c => c.label === profileFilter);
          const nonProfileChildren = node.children.filter(c => !isProfileKey(c.label));

          if (matchingProfileChild && matchingProfileChild.children && matchingProfileChild.children.length > 0) {
            effectiveChildren = [
              ...matchingProfileChild.children, 
              ...nonProfileChildren
            ];
          } else if (matchingProfileChild) {
            displayVal = matchingProfileChild.value;
            displayLoc = matchingProfileChild.excelLoc;
            targetId = matchingProfileChild.id;
            effectiveChildren = nonProfileChildren;
          } else {
            effectiveChildren = nonProfileChildren;
          }
        }

        const rowItem = {
          node: node,
          id: node.id,
          targetId: targetId,
          label: displayLabel,
          value: displayVal,
          depth: currentDepth,
          hasChildren: effectiveChildren.length > 0,
          expanded: node.expanded !== false,
          checked: node.checked !== false,
          excelLoc: displayLoc
        };

        rows.push(rowItem);

        if (rowItem.hasChildren && rowItem.expanded) {
          const childRows = flattenVisibleNodes(effectiveChildren, profileFilter, searchTerm, versionScope, currentDepth + 1);
          rows = rows.concat(childRows);
        }
      });

      return rows;
    }

    function filterTreeWithSearch(nodes, term) {
      if (!term) return nodes;

      function matchSubtree(nodeList) {
        let matched = [];
        nodeList.forEach(node => {
          const labelMatch = node.label.toLowerCase().includes(term);
          const valMatch = node.value !== null && node.value !== undefined && String(node.value).toLowerCase().includes(term);

          if (labelMatch || valMatch) {
            matched.push({
              id: node.id,
              label: node.label,
              value: node.value,
              checked: node.checked,
              expanded: node.children && node.children.length > 0 ? true : node.expanded,
              excelLoc: node.excelLoc,
              opasVersions: node.opasVersions,
              children: node.children || []
            });
          } else {
            let matchingChildren = [];
            if (node.children && node.children.length > 0) {
              matchingChildren = matchSubtree(node.children);
            }

            if (matchingChildren.length > 0) {
              matched.push({
                id: node.id,
                label: node.label,
                value: node.value,
                checked: node.checked,
                expanded: true,
                excelLoc: node.excelLoc,
                opasVersions: node.opasVersions,
                children: matchingChildren
              });
            }
          }
        });
        return matched;
      }

      return matchSubtree(nodes);
    }

    function refreshVirtualTree() {
      const file = getActiveFile();
      const spacer = document.getElementById("virtual-tree-spacer");
      const content = document.getElementById("virtual-tree-content");
      const badge = document.getElementById("row-count-badge");

      if (!file || !file.treeData || file.treeData.length === 0) {
        spacer.style.height = "0px";
        content.style.transform = "none";
        content.innerHTML = `
          <div class="empty-placeholder">
            <i class="fa-solid fa-file-excel" style="font-size: 2.2rem; color: var(--accent-primary);"></i>
            <span>No file open. Click "File > Open File(s)..." above to load an Excel workbook (.xlsx, .xls, .csv), JSON, or YAML.</span>
          </div>
        `;
        badge.textContent = "";
        return;
      }

      const searchTerm = document.getElementById("search-input").value.toLowerCase().trim();
      let sourceTree = file.treeData;

      if (searchTerm) {
        sourceTree = filterTreeWithSearch(file.treeData, searchTerm);
      }

      virtualRowsList = flattenVisibleNodes(sourceTree, selectedProfileFilter, searchTerm, selectedVersionScope, 0);
      
      const totalHeight = virtualRowsList.length * ROW_HEIGHT;
      spacer.style.height = `${totalHeight}px`;
      badge.textContent = `${virtualRowsList.length.toLocaleString()} nodes`;

      handleVirtualScroll();
    }

    function handleVirtualScroll() {
      if (currentViewMode !== "tree_view") return;

      const viewport = document.getElementById("virtual-tree-viewport");
      const content = document.getElementById("virtual-tree-content");

      if (virtualRowsList.length === 0) {
        content.innerHTML = "";
        return;
      }

      const scrollTop = viewport.scrollTop;
      const viewportHeight = viewport.clientHeight;

      const startIndex = Math.max(0, Math.floor(scrollTop / ROW_HEIGHT) - 8);
      const endIndex = Math.min(virtualRowsList.length, Math.ceil((scrollTop + viewportHeight) / ROW_HEIGHT) + 8);

      const topOffset = startIndex * ROW_HEIGHT;
      content.style.transform = `translateY(${topOffset}px)`;

      let html = "";
      for (let i = startIndex; i < endIndex; i++) {
        const item = virtualRowsList[i];
        const paddingLeft = item.depth * 18 + 6;
        const isReq = isRequirementKey(item.label);
        const hasValueContent = item.value !== null && item.value !== undefined && String(item.value).trim() !== "";
        const displayVal = hasValueContent ? String(item.value) : "";
        const isAnonymousItem = item.label === "";
        const showInputBox = isEditMode || hasValueContent || isReq;

        html += `
          <div class="virtual-row ${!item.checked ? 'node-hidden' : ''}" style="padding-left: ${paddingLeft}px;" data-id="${item.id}">
            <span class="toggle-icon ${!item.hasChildren ? 'hidden-icon' : ''}" onclick="toggleVirtualExpand('${item.id}')">
              <i class="fa-solid ${item.expanded ? 'fa-chevron-down' : 'fa-chevron-right'}"></i>
            </span>
            <div class="visibility-toggle ${item.checked ? 'visible' : 'hidden-node'}" onclick="toggleVirtualVisibility('${item.id}')">
              <i class="fa-solid ${item.checked ? 'fa-eye' : 'fa-eye-slash'}"></i>
            </div>
            ${!isAnonymousItem ? `<span class="node-label" title="${item.label}">${item.label}</span>` : ''}
            ${(!item.hasChildren && showInputBox) || hasValueContent ? `
              ${!isAnonymousItem ? `<span class="node-colon">:</span>` : ''}
              <input 
                type="text" 
                class="node-value-input" 
                value="${displayVal}" 
                title="${displayVal}"
                placeholder="${isReq ? 'Mandatory / Recommended...' : 'value'}"
                ${isReq ? 'list="requirement-options-list"' : ''}
                onchange="updateNodeValue('${item.targetId}', this.value)"
              />
            ` : ''}
            <div class="node-actions">
              <button class="action-btn" title="Edit Label" onclick="editNodeLabel('${item.id}')"><i class="fa-solid fa-pen"></i></button>
              <button class="action-btn" title="Add Child Node" onclick="addChildNode('${item.id}')"><i class="fa-solid fa-plus"></i></button>
              <button class="action-btn delete-btn" title="Delete Node" onclick="deleteNode('${item.id}')"><i class="fa-regular fa-trash-can"></i></button>
            </div>
          </div>
        `;
      }

      content.innerHTML = html;
    }

    function handleSearchInput(val) {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        if (currentViewMode === "compare_view") {
          filterComparisonMatrixTable(val);
        } else {
          refreshVirtualTree();
        }
      }, 120);
    }

    function toggleVirtualExpand(nodeId) {
      const file = getActiveFile();
      const node = findNodeById(file.treeData, nodeId);
      if (node) {
        node.expanded = !node.expanded;
        refreshVirtualTree();
      }
    }

    function toggleVirtualVisibility(nodeId) {
      if (!isEditMode) return;
      const file = getActiveFile();
      const node = findNodeById(file.treeData, nodeId);
      if (node) {
        const newState = !node.checked;
        setSubtreeVisibility(node, newState);
        if (newState) ensureParentsVisible(file.treeData, nodeId);

        if (!isPaneHidden) updateOutputFromTree();
        refreshVirtualTree();
      }
    }

    function refreshView() {
      if (currentViewMode === "compare_view") {
        renderComparisonInTreePane();
      } else {
        refreshVirtualTree();
      }
    }

    function filterComparisonMatrixTable(searchTerm) {
      const term = searchTerm.toLowerCase().trim();
      const rows = document.querySelectorAll(".compare-table tbody tr");

      rows.forEach(row => {
        if (!term) {
          row.style.display = "";
          return;
        }

        const textContent = row.textContent.toLowerCase();
        const inputs = row.querySelectorAll("input");
        let inputMatch = false;
        inputs.forEach(inp => {
          if (inp.value.toLowerCase().includes(term)) inputMatch = true;
        });

        row.style.display = (textContent.includes(term) || inputMatch) ? "" : "none";
      });
    }

    function renderComparisonInTreePane() {
      const container = document.getElementById("virtual-tree-content");
      const spacer = document.getElementById("virtual-tree-spacer");
      const badge = document.getElementById("row-count-badge");
      const file = getActiveFile();

      spacer.style.height = "0px";
      container.style.transform = "none";
      badge.textContent = "";

      if (!file || !file.treeData || file.treeData.length === 0) {
        container.innerHTML = `
          <div class="empty-placeholder">
            <i class="fa-solid fa-code-compare" style="font-size: 2.2rem; color: var(--accent-primary);"></i>
            <span>No active specification file open to build comparison matrix.</span>
          </div>
        `;
        return;
      }

      if (selectedCompareProfiles.length === 0) {
        container.innerHTML = `<div style="color: var(--text-muted); padding: 15px;">Please select at least one profile from the dropdown above to compare.</div>`;
        return;
      }

      const matrixRows = buildMultiProfileComparisonRows(file.treeData, selectedCompareProfiles, selectedVersionScope);

      if (matrixRows.length === 0) {
        container.innerHTML = `<div style="color: var(--text-muted); padding: 15px;">No occurrences found for selected profiles / version.</div>`;
        return;
      }

      let html = `
        <div class="compare-table-wrapper">
          <table class="compare-table">
            <thead>
              <tr>
                <th style="min-width: 200px;">Property / Node</th>
                <th style="min-width: 100px; text-align: center;">O-PAS Ver</th>
                <th style="min-width: 160px;">Requirement Attribute</th>
      `;

      selectedCompareProfiles.forEach(prof => {
        html += `<th style="min-width: 140px;">${prof}</th>`;
      });

      html += `
              </tr>
            </thead>
            <tbody>
      `;

      matrixRows.forEach(row => {
        const vBadges = [];
        if (row.versions?.v1) vBadges.push(`<span class="version-tag">V1</span>`);
        if (row.versions?.v2) vBadges.push(`<span class="version-tag">V2</span>`);
        if (row.versions?.v3) vBadges.push(`<span class="version-tag">V3</span>`);
        const versionsCell = vBadges.length > 0 ? vBadges.join("") : `<span class="diff-absent">-</span>`;

        html += `
          <tr>
            <td><span class="path-code-last" title="${row.fullPath}">${row.propertyName}</span></td>
            <td style="text-align: center;">${versionsCell}</td>
            <td><code>${row.attributeName}</code></td>
        `;

        selectedCompareProfiles.forEach(prof => {
          const profData = row.profilesData[prof];
          if (profData) {
            const val = profData.val !== undefined && profData.val !== null ? String(profData.val) : "";
            html += `
              <td>
                <input type="text" class="matrix-input" value="${val}" list="requirement-options-list" onchange="updateNodeValue('${profData.id}', this.value)" />
              </td>
            `;
          } else {
            html += `<td><span class="diff-absent">Not Present</span></td>`;
          }
        });

        html += `</tr>`;
      });

      html += `</tbody></table></div>`;
      container.innerHTML = html;
    }

    function buildMultiProfileComparisonRows(treeNodes, activeProfiles, versionScope = "__ALL__") {
      const rows = [];

      function traverse(nodeList, ancestorPath = []) {
        nodeList.forEach(node => {
          if (!nodeMatchesVersionScope(node, versionScope)) return;

          const currentPath = [...ancestorPath, node.label];

          if (node.children && node.children.length > 0) {
            const matchingChildren = node.children.filter(c => activeProfiles.includes(c.label));

            if (matchingChildren.length > 0) {
              const attrsMap = {};

              matchingChildren.forEach(childProf => {
                const profName = childProf.label;
                if (childProf.children && childProf.children.length > 0) {
                  childProf.children.forEach(attr => {
                    if (!attrsMap[attr.label]) attrsMap[attr.label] = {};
                    attrsMap[attr.label][profName] = { val: attr.value, id: attr.id };
                  });
                } else {
                  if (!attrsMap["Value"]) attrsMap["Value"] = {};
                  attrsMap["Value"][profName] = { val: childProf.value, id: childProf.id };
                }
              });

              Object.keys(attrsMap).forEach(attrName => {
                rows.push({
                  fullPath: currentPath.join(" > "),
                  propertyName: node.label,
                  attributeName: attrName,
                  versions: node.opasVersions,
                  profilesData: attrsMap[attrName]
                });
              });
            }

            traverse(node.children, currentPath);
          }
        });
      }

      traverse(treeNodes, []);
      return rows;
    }

    function createNewFileTab(fileName, treeStructure, format = 'yaml', rawZipInstance = null, sheetNameMap = {}) {
      const fileId = "file_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4);
      const newFile = {
        id: fileId,
        name: fileName,
        treeData: treeStructure,
        format: format,
        zip: rawZipInstance,
        sheetMap: sheetNameMap,
        modifiedCells: {}
      };

      filesState.push(newFile);
      switchToFileTab(fileId);
    }

    function switchToFileTab(fileId) {
      activeFileId = fileId;
      const currentFile = getActiveFile();

      if (currentFile) {
        renderTabsUI();
        updateSheetDropdown(currentFile);
        switchFormat(currentFile.format, false);
        document.getElementById("search-input").value = "";
        updateProfileDropdowns();
        refreshView();
        if (!isPaneHidden) updateOutputFromTree();
      }
    }

    function updateSheetDropdown(file) {
      const group = document.getElementById("sheet-selector-group");
      const select = document.getElementById("excel-sheet-select");

      const sheetNames = Object.keys(file?.sheetMap || {});
      if (sheetNames.length > 1) {
        group.style.display = "flex";
        select.innerHTML = "";
        sheetNames.forEach(sheetName => {
          const opt = document.createElement("option");
          opt.value = sheetName;
          opt.textContent = sheetName;
          select.appendChild(opt);
        });
      } else {
        group.style.display = "none";
      }
    }

    async function switchExcelSheet(sheetName) {
      const file = getActiveFile();
      if (!file || !file.zip) return;

      showLoading(true, "Switching Sheet...");
      setTimeout(async () => {
        try {
          const sheetXmlPath = file.sheetMap[sheetName];
          if (sheetXmlPath) {
            const xmlContent = await file.zip.file(sheetXmlPath).async("string");
            
            let sharedStrings = [];
            const sharedStringsFile = file.zip.file("xl/sharedStrings.xml");
            if (sharedStringsFile) {
              const ssXml = await sharedStringsFile.async("string");
              sharedStrings = parseSharedStringsXml(ssXml);
            }

            file.treeData = parseSheetXmlToTreeData(xmlContent, sheetName, sharedStrings);
            updateProfileDropdowns();
            refreshView();
            if (!isPaneHidden) updateOutputFromTree();
          }
        } catch (err) {
          alert(`Error switching sheet: ${err.message}`);
        } finally {
          showLoading(false);
        }
      }, 20);
    }

    function closeFileTab(e, fileId) {
      e.stopPropagation();
      filesState = filesState.filter(f => f.id !== fileId);
      
      if (filesState.length === 0) {
        activeFileId = null;
        renderTabsUI();
        document.getElementById("sheet-selector-group").style.display = "none";
        refreshView();
        document.getElementById("code-output").textContent = "";
        return;
      }

      if (activeFileId === fileId) {
        switchToFileTab(filesState[filesState.length - 1].id);
      } else {
        renderTabsUI();
      }
    }

    function renderTabsUI() {
      const tabsBar = document.getElementById("file-tabs-bar");
      tabsBar.innerHTML = "";

      if (filesState.length > 1) {
        tabsBar.classList.add("visible-bar");
        document.body.classList.add("multi-file-active");
      } else {
        tabsBar.classList.remove("visible-bar");
        document.body.classList.remove("multi-file-active");
      }

      filesState.forEach(file => {
        const tabEl = document.createElement("div");
        tabEl.className = `file-tab ${file.id === activeFileId ? 'active' : ''}`;
        tabEl.onclick = () => switchToFileTab(file.id);

        let iconClass = "fa-file-lines";
        if (file.name.match(/\.(xlsx|xls|csv)$/i)) iconClass = "fa-file-excel";
        else if (file.name.endsWith(".json")) iconClass = "fa-code";

        tabEl.innerHTML = `
          <i class="fa-solid ${iconClass}"></i>
          <span>${file.name}</span>
          <i class="fa-solid fa-xmark tab-close-btn" onclick="closeFileTab(event, '${file.id}')"></i>
        `;
        tabsBar.appendChild(tabEl);
      });
    }

    function getActiveFile() {
      return filesState.find(f => f.id === activeFileId);
    }

    function triggerFileInput() {
      document.getElementById("file-input").click();
    }

    function handleFileSelect(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;
      
      showLoading(true, "Opening Workbook...");
      setTimeout(() => {
        Array.from(files).forEach(file => processUploadedFile(file));
        event.target.value = "";
        showLoading(false);
      }, 20);
    }

    async function parseAndOpenExcelBuffer(buffer, fileName, preferredSheetName = null) {
      const zip = await JSZip.loadAsync(buffer);
      const workbookXml = await zip.file("xl/workbook.xml").async("string");
      const relsXml = await zip.file("xl/_rels/workbook.xml.rels").async("string");

      const parser = new DOMParser();
      const wbDoc = parser.parseFromString(workbookXml, "application/xml");
      const relsDoc = parser.parseFromString(relsXml, "application/xml");

      const sheets = wbDoc.getElementsByTagName("sheet");
      const rels = relsDoc.getElementsByTagName("Relationship");

      const relMap = {};
      for (let i = 0; i < rels.length; i++) {
        relMap[rels[i].getAttribute("Id")] = "xl/" + rels[i].getAttribute("Target");
      }

      const sheetMap = {};
      let firstSheetName = "";
      for (let i = 0; i < sheets.length; i++) {
        const name = sheets[i].getAttribute("name");
        const rId = sheets[i].getAttribute("r:id") || sheets[i].getAttribute("id");
        sheetMap[name] = relMap[rId];
        if (i === 0) firstSheetName = name;
      }

      let chosenSheetName = firstSheetName;
      if (preferredSheetName && sheetMap[preferredSheetName]) {
        chosenSheetName = preferredSheetName;
      } else if (preferredSheetName) {
        const found = Object.keys(sheetMap).find(s => s.toLowerCase().includes(preferredSheetName.toLowerCase()));
        if (found) chosenSheetName = found;
      }

      const chosenSheetXmlPath = sheetMap[chosenSheetName];
      const xmlContent = await zip.file(chosenSheetXmlPath).async("string");

      let sharedStrings = [];
      const sharedStringsFile = zip.file("xl/sharedStrings.xml");
      if (sharedStringsFile) {
        const ssXml = await sharedStringsFile.async("string");
        sharedStrings = parseSharedStringsXml(ssXml);
      }

      const convertedTree = parseSheetXmlToTreeData(xmlContent, chosenSheetName, sharedStrings);
      createNewFileTab(fileName, convertedTree, 'yaml', zip, sheetMap);

      const sheetSelect = document.getElementById("excel-sheet-select");
      if (sheetSelect && sheetSelect.querySelector(`option[value="${chosenSheetName}"]`)) {
        sheetSelect.value = chosenSheetName;
      }
    }

    function processUploadedFile(file) {
      const fileName = file.name;
      const isExcel = /\.xlsx$/i.test(fileName);

      if (isExcel) {
        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            await parseAndOpenExcelBuffer(e.target.result, fileName);
          } catch (err) {
            alert(`Error reading Excel file ${fileName}: ${err.message}`);
          }
        };
        reader.readAsArrayBuffer(file);
      } else {
        const reader = new FileReader();
        reader.onload = (e) => {
          const content = e.target.result;
          let parsed = null;
          let format = fileName.endsWith(".json") ? "json" : "yaml";

          try {
            if (format === 'yaml') {
              parsed = window.jsyaml ? jsyaml.load(content) : JSON.parse(content);
            } else {
              parsed = JSON.parse(content);
            }

            if (typeof parsed === 'object' && parsed !== null) {
              const convertedTree = objectToTreeData(parsed, []);
              createNewFileTab(fileName, convertedTree, format, null);
            }
          } catch (err) {
            alert(`Error parsing ${fileName}: ${err.message}`);
          }
        };
        reader.readAsText(file);
      }
    }

    function parseSharedStringsXml(xmlString) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlString, "application/xml");
      const siElements = doc.getElementsByTagName("si");
      const strings = [];
      for (let i = 0; i < siElements.length; i++) {
        strings.push(siElements[i].textContent || "");
      }
      return strings;
    }

    function colLettersToIndex(letters) {
      let index = 0;
      for (let i = 0; i < letters.length; i++) {
        index = index * 26 + (letters.charCodeAt(i) - 64);
      }
      return index - 1;
    }

    function parseSheetXmlToTreeData(sheetXmlString, sheetName, sharedStrings = []) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(sheetXmlString, "application/xml");
      const rowElements = doc.getElementsByTagName("row");
      const rawRows = [];

      for (let r = 0; r < rowElements.length; r++) {
        const rowEl = rowElements[r];
        const rIndex = parseInt(rowEl.getAttribute("r")) - 1;
        const cellElements = rowEl.getElementsByTagName("c");
        const rowValues = [];
        const cellRefMap = [];

        for (let c = 0; c < cellElements.length; c++) {
          const cellEl = cellElements[c];
          const cellRef = cellEl.getAttribute("r");
          const colLetters = cellRef.replace(/[0-9]/g, '');
          const colIdx = colLettersToIndex(colLetters);
          const cellType = cellEl.getAttribute("t");

          let val = "";
          const vEl = cellEl.getElementsByTagName("v")[0];
          const isEl = cellEl.getElementsByTagName("is")[0];

          if (cellType === "s" && vEl) {
            const ssIndex = parseInt(vEl.textContent);
            val = sharedStrings[ssIndex] || "";
          } else if (cellType === "inlineStr" && isEl) {
            val = isEl.textContent || "";
          } else if (vEl) {
            val = vEl.textContent || "";
          }

          rowValues[colIdx] = val;
          cellRefMap[colIdx] = cellRef;
        }

        rawRows[rIndex] = {
          values: rowValues,
          cellRefs: cellRefMap,
          xmlRow: rIndex + 1
        };
      }

      return buildTreeFrom2DMatrix(rawRows, sheetName);
    }

    function findPropertyNodeDeep(nodeList, targetName) {
      if (!nodeList || !targetName) return null;
      const cleanTarget = targetName.trim().toLowerCase();
      for (let node of nodeList) {
        if (node.label.trim().toLowerCase() === cleanTarget) return node;
        if (node.children && node.children.length > 0) {
          const found = findPropertyNodeDeep(node.children, targetName);
          if (found) return found;
        }
      }
      return null;
    }

    function buildTreeFrom2DMatrix(rawRows, sheetName) {
      if (!rawRows || rawRows.length === 0) return [];

      let nodeCount = 0;
      function createNode(label, value = null, isExpanded = false, loc = null, versions = null) {
        return {
          id: "n_" + (++nodeCount),
          label: String(label).trim(),
          value: value !== null ? parseTypedValue(String(value)) : null,
          checked: true,
          expanded: isExpanded,
          excelLoc: loc,
          opasVersions: versions || { v1: false, v2: false, v3: false },
          children: []
        };
      }

      function parseVersionFlags(line) {
        const isY = (val) => String(val || "").trim().toUpperCase() === 'Y' || String(val || "").trim() === '1';
        return {
          v1: isY(line[8]),
          v2: isY(line[9]),
          v3: isY(line[10])
        };
      }

      function mapReqCodeToText(code) {
        const c = String(code || "").trim().toUpperCase();
        if (c === 'M') return 'Mandatory';
        if (c === 'R') return 'Recommended';
        if (c === 'I') return 'IfImplemented';
        if (c === 'C') return 'Conditional';
        return 'None';
      }

      function getCellMeta(rowObj, colIdx) {
        if (!rowObj) return null;
        return {
          sheet: sheetName,
          cellRef: rowObj.cellRefs && rowObj.cellRefs[colIdx] ? rowObj.cellRefs[colIdx] : (indexToColLetters(colIdx) + rowObj.xmlRow),
          row: rowObj.xmlRow,
          col: colIdx
        };
      }

      function attachProfileRequirements(parentNode, reqs, rowObj, versions) {
        const profileDefs = [
          { name: "OSM-Redfish", read: mapReqCodeToText(reqs[0]), write: mapReqCodeToText(reqs[1]), rCol: 2, wCol: 3 },
          { name: "OSM-RedfishBMC", read: mapReqCodeToText(reqs[2]), write: mapReqCodeToText(reqs[3]), rCol: 4, wCol: 5 },
          { name: "OSM-RedfishDCN", read: mapReqCodeToText(reqs[4]), write: mapReqCodeToText(reqs[5]), rCol: 6, wCol: 7 }
        ];

        profileDefs.forEach(p => {
          if (p.read !== 'None' || p.write !== 'None') {
            let profNode = parentNode.children.find(c => c.label === p.name);
            if (!profNode) {
              profNode = createNode(p.name, null, false, getCellMeta(rowObj, p.rCol), versions);
              parentNode.children.push(profNode);
            }
            if (p.read !== 'None') {
              profNode.children.push(createNode("ReadRequirement", p.read, false, getCellMeta(rowObj, p.rCol), versions));
            }
            if (p.write !== 'None') {
              profNode.children.push(createNode("WriteRequirement", p.write, false, getCellMeta(rowObj, p.wCol), versions));
            }
          }
        });
      }

      let profileNameNode = null;
      let profilePurposeNode = null;
      let schemasContainerNode = createNode("Schemas", null, false);

      for (let r = 0; r < rawRows.length; r++) {
        const rowObj = rawRows[r];
        if (!rowObj) continue;
        const row = rowObj.values || [];
        const rowHeader = String(row[0] || "").trim();

        const rowTypeZ = String(row[25] || "").trim();
        if (rowTypeZ === 'Resource' || rowTypeZ === 'Collection') {
          const curResName = String(row[26] || "").trim();
          if (curResName) {
            const schemaMeta = {
              type: rowTypeZ,
              resource: curResName,
              version: String(row[27] || "").trim(),
              description: String(row[28] || "").trim(),
              longDescription: String(row[29] || "").trim() || String(row[28] || "").trim(),
              path: String(row[30] || "").trim().split(/\s+/),
              insertable: String(row[31] || "").trim(),
              updatable: String(row[32] || "").trim(),
              deletable: String(row[33] || "").trim(),
              url: String(row[34] || "").trim(),
              additionalResources: String(row[35] || "").trim()
            };

            let schemaNode = createNode(curResName, null, false, getCellMeta(rowObj, 26));
            schemaNode.schemaMeta = schemaMeta;
            schemaNode.children.push(createNode("Version", schemaMeta.version, false, getCellMeta(rowObj, 27)));
            schemaNode.children.push(createNode("Description", schemaMeta.description, false, getCellMeta(rowObj, 28)));
            schemaNode.children.push(createNode("LongDescription", schemaMeta.longDescription, false, getCellMeta(rowObj, 29)));
            schemaNode.children.push(createNode("Path", schemaMeta.path.join(", "), false, getCellMeta(rowObj, 30)));
            schemaNode.children.push(createNode("Insertable", schemaMeta.insertable, false, getCellMeta(rowObj, 31)));
            schemaNode.children.push(createNode("Updatable", schemaMeta.updatable, false, getCellMeta(rowObj, 32)));
            schemaNode.children.push(createNode("Deletable", schemaMeta.deletable, false, getCellMeta(rowObj, 33)));
            schemaNode.children.push(createNode("Url", schemaMeta.url, false, getCellMeta(rowObj, 34)));

            schemasContainerNode.children.push(schemaNode);
          }
        }

        if (rowHeader === "ProfileName") {
          profileNameNode = createNode("ProfileName", null, true, getCellMeta(rowObj, 0));
          const p1 = String(row[2] || row[3] || "").trim();
          const p2 = String(row[4] || row[5] || "").trim();
          const p3 = String(row[6] || row[7] || "").trim();
          if (p1) profileNameNode.children.push(createNode("OSM-Redfish", p1, false, getCellMeta(rowObj, row[2] ? 2 : 3)));
          if (p2) profileNameNode.children.push(createNode("OSM-RedfishBMC", p2, false, getCellMeta(rowObj, row[4] ? 4 : 5)));
          if (p3) profileNameNode.children.push(createNode("OSM-RedfishDCN", p3, false, getCellMeta(rowObj, row[6] ? 6 : 7)));
        } else if (rowHeader === "ProfilePurpose") {
          profilePurposeNode = createNode("ProfilePurpose", null, true, getCellMeta(rowObj, 0));
          const purp1 = String(row[2] || row[3] || "").trim();
          const purp2 = String(row[4] || row[5] || "").trim();
          const purp3 = String(row[6] || row[7] || "").trim();
          if (purp1) profilePurposeNode.children.push(createNode("OSM-Redfish", purp1, false, getCellMeta(rowObj, row[2] ? 2 : 3)));
          if (purp2) profilePurposeNode.children.push(createNode("OSM-RedfishBMC", purp2, false, getCellMeta(rowObj, row[4] ? 4 : 5)));
          if (purp3) profilePurposeNode.children.push(createNode("OSM-RedfishDCN", purp3, false, getCellMeta(rowObj, row[6] ? 6 : 7)));
        }
      }

      const resourcesContainerNode = createNode("Resources", null, true);

      let i = 0;
      while (i < rawRows.length) {
        const rowObj = rawRows[i];
        if (!rowObj) {
          i++;
          continue;
        }

        const line = rowObj.values || [];
        const colA = String(line[0] || "").trim();
        const colB = String(line[1] || "").trim();

        let isResourceTrigger = false;
        let detectedResourceName = "";

        if (colA.startsWith("6.5.")) {
          if (!RESOURCE_BLACKLIST.includes(colB.trim())) {
            detectedResourceName = colB.trim();
            isResourceTrigger = true;
          }
        } else if (colA.startsWith("1.1.")) {
          const testString = colA.split(/\s+/).filter(Boolean);
          const candidateName = testString[testString.length - 1];
          if (!RESOURCE_BLACKLIST.includes(candidateName)) {
            detectedResourceName = candidateName;
            isResourceTrigger = true;
          }
        }

        if (isResourceTrigger && detectedResourceName) {
          const resVersions = parseVersionFlags(line);
          const resourceRoot = createNode(detectedResourceName, null, false, getCellMeta(rowObj, 0), resVersions);

          let rowDescIdx = i + 1;
          if (rowDescIdx < rawRows.length && rawRows[rowDescIdx]) {
            const possibleDesc = String(rawRows[rowDescIdx].values[0] || "").trim();
            if (
              !possibleDesc.startsWith("1.1.") && 
              !possibleDesc.startsWith("6.5.") && 
              !possibleDesc.includes("Profile") && 
              !possibleDesc.startsWith("Table ") && 
              possibleDesc.toLowerCase() !== "property" && 
              possibleDesc.toLowerCase() !== "(property)"
            ) {
              resourceRoot.children.push(createNode("Purpose", possibleDesc, false, getCellMeta(rawRows[rowDescIdx], 0), resVersions));
            }
          }

          let rIndex = i + 1;
          let cur_prop_node = null;
          let cur_sub_prop_node = null;
          let cur_sub_sub_prop_node = null;

          while (rIndex < rawRows.length) {
            const pRowObj = rawRows[rIndex];
            if (!pRowObj) {
              rIndex++;
              continue;
            }

            const pLine = pRowObj.values || [];
            const pColA = String(pLine[0] || "");
            const pColB = String(pLine[1] || "");
            const pColC = String(pLine[2] || "");

            if (pColA.startsWith("1.1.") || pColA.startsWith("6.5.") || pColA === "Conditional" || pColA.toLowerCase().includes("extrareq") || pColA.includes("/redfish/v1/")) {
              if (pColA.includes("/redfish/v1/")) {
                const uriVal = pColA.trim();
                const uriNode = resourceRoot.children.find(c => c.label.endsWith("URIs"));
                if (uriNode) {
                  uriNode.value = uriVal;
                  uriNode.excelLoc = getCellMeta(pRowObj, 0);
                } else {
                  resourceRoot.children.push(createNode(`${detectedResourceName} URIs`, uriVal, false, getCellMeta(pRowObj, 0)));
                }
              }
              break;
            }

            const pColATrimLower = pColA.trim().toLowerCase();

            if (
              pColATrimLower === "property" ||
              pColATrimLower === "(property)" ||
              pColA.startsWith("Table ") ||
              /Table\s+[0-9]+:/i.test(pColA) ||
              /\([vV]?[0-9]+[_\.0-9a-zA-Z]*\)/.test(pColA) || 
              pColB === "Profile" || 
              pColC === "Profile" || 
              pColA === "ProfileName" || 
              pColA === "ProfilePurpose" ||
              rIndex === rowDescIdx
            ) {
              rIndex++;
              continue;
            }

            const reqs = [pLine[2], pLine[3], pLine[4], pLine[5], pLine[6], pLine[7]];
            const rowVersions = parseVersionFlags(pLine);

            if (pColA === "ResourceRequirement") {
              attachProfileRequirements(resourceRoot, reqs, pRowObj, rowVersions);
            } else if (pColA === "Resource MinVersion") {
              const minVersionNode = createNode("MinVersion", null, false, getCellMeta(pRowObj, 0), rowVersions);
              const minVers = [
                { prof: "OSM-Redfish", ver: pLine[2], col: 2 },
                { prof: "OSM-RedfishBMC", ver: pLine[4], col: 4 },
                { prof: "OSM-RedfishDCN", ver: pLine[6], col: 6 }
              ];
              minVers.forEach(mv => {
                if (mv.ver && String(mv.ver).trim()) {
                  minVersionNode.children.push(createNode(mv.prof, String(mv.ver).trim(), false, getCellMeta(pRowObj, mv.col), rowVersions));
                }
              });
              if (minVersionNode.children.length > 0) resourceRoot.children.push(minVersionNode);
            } else if (pColA.startsWith("         ") && cur_sub_sub_prop_node) {
              const propName = pColA.trim();
              const node = createNode(propName, null, false, getCellMeta(pRowObj, 0), rowVersions);
              if (pColB.trim()) node.children.push(createNode("Purpose", pColB.trim(), false, getCellMeta(pRowObj, 1), rowVersions));
              attachProfileRequirements(node, reqs, pRowObj, rowVersions);
              cur_sub_sub_prop_node.children.push(node);
            } else if (pColA.startsWith("      ") && cur_sub_prop_node) {
              const propName = pColA.trim();
              cur_sub_sub_prop_node = createNode(propName, null, false, getCellMeta(pRowObj, 0), rowVersions);
              if (pColB.trim()) cur_sub_sub_prop_node.children.push(createNode("Purpose", pColB.trim(), false, getCellMeta(pRowObj, 1), rowVersions));
              attachProfileRequirements(cur_sub_prop_node, reqs, pRowObj, rowVersions);
              cur_sub_prop_node.children.push(cur_sub_sub_prop_node);
            } else if (pColA.startsWith("   ") && cur_prop_node) {
              let propName = pColA.trim();
              if (cur_prop_node.label === "Actions" && propName.includes(".")) {
                propName = propName.split(".")[1];
              }
              cur_sub_prop_node = createNode(propName, null, false, getCellMeta(pRowObj, 0), rowVersions);
              cur_sub_sub_prop_node = null;
              if (pColB.trim()) cur_sub_prop_node.children.push(createNode("Purpose", pColB.trim(), false, getCellMeta(pRowObj, 1), rowVersions));
              attachProfileRequirements(cur_sub_prop_node, reqs, pRowObj, rowVersions);
              cur_prop_node.children.push(cur_sub_prop_node);
            } else if (pColA.trim() && !pColA.startsWith("Profile") && pColA !== "ResourceRequirement" && pColA !== "Resource MinVersion") {
              const propName = pColA.trim();
              if (propName !== "Members") {
                cur_prop_node = createNode(propName, null, false, getCellMeta(pRowObj, 0), rowVersions);
                cur_sub_prop_node = null;
                cur_sub_sub_prop_node = null;
                if (pColB.trim()) cur_prop_node.children.push(createNode("Purpose", pColB.trim(), false, getCellMeta(pRowObj, 1), rowVersions));
                attachProfileRequirements(cur_prop_node, reqs, pRowObj, rowVersions);
                resourceRoot.children.push(cur_prop_node);
              }
            }

            rIndex++;
          }

          resourcesContainerNode.children.push(resourceRoot);
          i = rIndex - 1;
        } 
        
        else if (colA.toLowerCase().includes("extrareq") || (colA.toLowerCase() === "xx" && colB.toLowerCase() === "resource")) {
          let extraIndex = (colA.toLowerCase().includes("keyword")) ? i + 1 : i;

          while (extraIndex < rawRows.length) {
            const headObj = rawRows[extraIndex];
            if (!headObj) { extraIndex++; continue; }
            const hLine = headObj.values || [];
            const hColA = String(hLine[0] || "").trim().toLowerCase();
            const hParam = String(hLine[1] || "").trim().toLowerCase();

            if (hParam !== "resource") {
              if (hColA === "xx" || hColA.includes("extrareq")) {
                extraIndex++;
                continue;
              }
              break;
            }

            const targetResource = String(hLine[2] || "").trim();
            let targetProperty = "";
            let targetSubProperty = "";
            let targetSubSubProperty = "";
            let paramsMap = {};

            let entryIdx = extraIndex + 1;
            while (entryIdx < rawRows.length) {
              const eRowObj = rawRows[entryIdx];
              if (!eRowObj) { entryIdx++; continue; }
              const eLine = eRowObj.values || [];
              const eColA = String(eLine[0] || "").trim().toLowerCase();
              const paramName = String(eLine[1] || "").trim();
              const val = String(eLine[2] || "").trim();

              if (eColA !== "xx" && !eColA.includes("extrareq")) break;
              if (paramName.toLowerCase() === "resource") break;

              if (paramName.toLowerCase() === "property") targetProperty = val;
              else if (paramName.toLowerCase() === "subproperty") targetSubProperty = val;
              else if (paramName.toLowerCase() === "subsubproperty") targetSubSubProperty = val;
              else if (paramName) {
                if (!paramsMap[paramName]) paramsMap[paramName] = [];
                paramsMap[paramName].push({ val: val, rowObj: eRowObj });
              }
              entryIdx++;
            }

            const extraGroup = createNode("ExtraReq", null, false, getCellMeta(headObj, 0));

            for (const pName in paramsMap) {
              const items = paramsMap[pName];
              if (items.length === 1) {
                extraGroup.children.push(createNode(pName, items[0].val, false, getCellMeta(items[0].rowObj, 2)));
              } else {
                const listContainer = createNode(pName, null, false, getCellMeta(items[0].rowObj, 1));
                items.forEach(item => {
                  listContainer.children.push(createNode("", item.val, false, getCellMeta(item.rowObj, 2)));
                });
                extraGroup.children.push(listContainer);
              }
            }

            const targetResNode = resourcesContainerNode.children.find(n => n.label.toLowerCase() === targetResource.toLowerCase());
            const propName = targetSubSubProperty || targetSubProperty || targetProperty;

            if (targetResNode) {
              if (propName) {
                const targetPropNode = findPropertyNodeDeep(targetResNode.children, propName);
                if (targetPropNode) {
                  targetPropNode.children.push(extraGroup);
                } else {
                  targetResNode.children.push(extraGroup);
                }
              } else {
                targetResNode.children.push(extraGroup);
              }
            } else {
              extraGroup.label = `ExtraReq (${targetResource}${propName ? ' > ' + propName : ''})`;
              resourcesContainerNode.children.push(extraGroup);
            }

            extraIndex = entryIdx;
          }

          i = extraIndex - 1;
        }

        i++;
      }

      function bubbleUpVersions(nodeList) {
        nodeList.forEach(node => {
          if (node.children && node.children.length > 0) {
            bubbleUpVersions(node.children);
            node.children.forEach(c => {
              if (c.opasVersions) {
                if (c.opasVersions.v1) node.opasVersions.v1 = true;
                if (c.opasVersions.v2) node.opasVersions.v2 = true;
                if (c.opasVersions.v3) node.opasVersions.v3 = true;
              }
            });
          }
        });
      }

      const finalTree = [];
      if (profileNameNode) finalTree.push(profileNameNode);
      if (profilePurposeNode) finalTree.push(profilePurposeNode);
      if (resourcesContainerNode.children.length > 0) finalTree.push(resourcesContainerNode);
      if (schemasContainerNode.children.length > 0) finalTree.push(schemasContainerNode); // نقلنا السكيما لتكون بعد Resources

      bubbleUpVersions(finalTree);

      return finalTree;
    }

    function indexToColLetters(colIndex) {
      let temp = colIndex + 1;
      let letter = '';
      while (temp > 0) {
        let mod = (temp - 1) % 26;
        letter = String.fromCharCode(65 + mod) + letter;
        temp = Math.floor((temp - mod) / 26);
      }
      return letter;
    }

    function mapRequirementInputToCode(rawVal) {
      const v = String(rawVal || "").trim();
      const upper = v.toUpperCase();
      if (upper.startsWith("M")) return "M";
      if (upper.startsWith("R")) return "R";
      if (upper.startsWith("C")) return "C";
      if (upper.startsWith("I")) return "I";
      if (upper === "NONE" || upper === "") return "";
      return v;
    }

    function updateNodeValue(targetNodeId, newValue) {
      const file = getActiveFile();
      if (!file) return;

      const node = findNodeById(file.treeData, targetNodeId);
      if (!node) return;

      node.value = parseTypedValue(newValue);

      if (node.excelLoc) {
        const loc = node.excelLoc;
        const sheetName = loc.sheet;
        const cellRef = loc.cellRef;
        const codeVal = mapRequirementInputToCode(newValue);

        if (!file.modifiedCells[sheetName]) {
          file.modifiedCells[sheetName] = {};
        }

        file.modifiedCells[sheetName][cellRef] = codeVal;
      }

      if (!isPaneHidden) {
        const processedNodes = filterTreeByProfile(file.treeData, selectedProfileFilter);
        const exportedData = buildExportObject(processedNodes, selectedVersionScope);
        if (file.format === 'yaml') {
          codeRawText = window.jsyaml ? jsyaml.dump(exportedData) : simpleYamlDump(exportedData);
        } else {
          codeRawText = JSON.stringify(exportedData, null, 2);
        }
        document.getElementById("code-output").textContent = codeRawText;
      }
    }

    async function saveExactPreservedExcelFile() {
      const file = getActiveFile();
      if (!file || !file.zip) {
        alert("No active Excel file loaded to save.");
        return;
      }

      try {
        showLoading(true, "Patching Worksheets...");

        const XML_NS = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";

        for (const sheetName in file.modifiedCells) {
          let sheetXmlPath = file.sheetMap[sheetName];
          if (!sheetXmlPath) {
            const foundKey = Object.keys(file.sheetMap).find(k => k.toLowerCase() === sheetName.toLowerCase());
            if (foundKey) sheetXmlPath = file.sheetMap[foundKey];
          }
          if (!sheetXmlPath) continue;

          let xmlContent = await file.zip.file(sheetXmlPath).async("string");
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlContent, "application/xml");

          const changes = file.modifiedCells[sheetName];

          for (const cellRef in changes) {
            const newVal = changes[cellRef];
            let cellEl = null;

            const cElements = xmlDoc.getElementsByTagName("c");
            for (let i = 0; i < cElements.length; i++) {
              if (cElements[i].getAttribute("r") === cellRef) {
                cellEl = cElements[i];
                break;
              }
            }

            if (!cellEl) {
              const rowNum = cellRef.replace(/[A-Za-z]/g, '');
              let rowEl = null;
              const rowElements = xmlDoc.getElementsByTagName("row");
              for (let r = 0; r < rowElements.length; r++) {
                if (rowElements[r].getAttribute("r") === rowNum) {
                  rowEl = rowElements[r];
                  break;
                }
              }

              if (!rowEl) {
                rowEl = xmlDoc.createElementNS(XML_NS, "row");
                rowEl.setAttribute("r", rowNum);
                const sheetData = xmlDoc.getElementsByTagName("sheetData")[0];
                if (sheetData) sheetData.appendChild(rowEl);
              }

              cellEl = xmlDoc.createElementNS(XML_NS, "c");
              cellEl.setAttribute("r", cellRef);
              rowEl.appendChild(cellEl);
            }

            while (cellEl.firstChild) {
              cellEl.removeChild(cellEl.firstChild);
            }

            cellEl.removeAttribute("t");

            if (newVal !== "" && newVal !== null && newVal !== undefined) {
              cellEl.setAttribute("t", "inlineStr");
              const isEl = xmlDoc.createElementNS(XML_NS, "is");
              const tEl = xmlDoc.createElementNS(XML_NS, "t");
              tEl.textContent = String(newVal);
              isEl.appendChild(tEl);
              cellEl.appendChild(isEl);
            }
          }

          const serializer = new XMLSerializer();
          file.zip.file(sheetXmlPath, serializer.serializeToString(xmlDoc));
        }

        const patchedBlob = await file.zip.generateAsync({
          type: "blob",
          compression: "DEFLATE",
          compressionOptions: { level: 6 },
          mimeType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        });

        const link = document.createElement("a");
        link.href = URL.createObjectURL(patchedBlob);
        link.download = file.name || "Updated_Specification.xlsx";
        link.click();
      } catch (err) {
        alert(`Error saving workbook: ${err.message}`);
      } finally {
        showLoading(false);
      }
    }

    function initResizer() {
      const resizer = document.getElementById("drag-resizer");
      const outputPanel = document.getElementById("output-panel");
      const container = document.getElementById("main-container");

      let x = 0;
      let outputWidth = 0;

      const mouseDownHandler = function (e) {
        if (isPaneHidden) return;
        x = e.clientX;
        outputWidth = outputPanel.getBoundingClientRect().width;
        resizer.classList.add("dragging");
        outputPanel.style.transition = "none";

        document.addEventListener("mousemove", mouseMoveHandler);
        document.addEventListener("mouseup", mouseUpHandler);
      };

      const mouseMoveHandler = function (e) {
        const dx = e.clientX - x;
        const containerWidth = container.getBoundingClientRect().width;
        let newWidth = ((outputWidth - dx) / containerWidth) * 100;

        newWidth = Math.max(25, Math.min(newWidth, 85));
        outputPanel.style.width = `${newWidth}%`;
      };

      const mouseUpHandler = function () {
        resizer.classList.remove("dragging");
        outputPanel.style.transition = "width 0.15s ease-out";

        document.removeEventListener("mousemove", mouseMoveHandler);
        document.removeEventListener("mouseup", mouseUpHandler);
      };

      resizer.addEventListener("mousedown", mouseDownHandler);
    }

    function isRequirementKey(label) {
      return label === "ReadRequirement" || label === "WriteRequirement" || label === "Requirement";
    }

    function setSubtreeVisibility(node, state) {
      node.checked = state;
      if (node.children) node.children.forEach(c => setSubtreeVisibility(c, state));
    }

    function ensureParentsVisible(nodes, targetId) {
      for (let node of nodes) {
        if (String(node.id) === String(targetId)) return true;
        if (node.children && node.children.length > 0) {
          if (ensureParentsVisible(node.children, targetId)) {
            node.checked = true;
            return true;
          }
        }
      }
      return false;
    }

    function deleteNodeRecursive(nodes, id) {
      return nodes.filter(node => {
        if (String(node.id) === String(id)) return false;
        if (node.children) node.children = deleteNodeRecursive(node.children, id);
        return true;
      });

    function collapseAll() {

    function setExpandedRecursive(nodes, value) {
      nodes.forEach(node => {
        node.expanded = value;
        if (node.children) setExpandedRecursive(node.children, value);
      });
    }

    function findNodeById(nodes, id) {
      if (!nodes) return null;
      for (let node of nodes) {
        if (String(node.id) === String(id)) return node;
        if (node.children && node.children.length > 0) {
          const found = findNodeById(node.children, id);
          if (found) return found;
        }
      }
      return null;
    }

    function parseTypedValue(val) {
      if (val === "" || val === null || val === undefined) return null;
      if (val === "true") return true;
      if (val === "false") return false;
      if (val === "null") return null;
      if (!isNaN(val) && String(val).trim() !== "") return Number(val);
      return val;
    }

    function filterTreeByProfile(nodes, profile) {
      if (!nodes) return [];
      let result = [];

      nodes.forEach(node => {
        if (isProfileKey(node.label) && profile !== "__ALL__" && node.label !== profile) {
          return;
        }

        let filteredChildren = [];
        if (node.children && node.children.length > 0) {
          filteredChildren = filterTreeByProfile(node.children, profile);
        }

        result.push({
          id: node.id,
          label: node.label,
          value: node.value,
          checked: node.checked,
          expanded: node.expanded,
          excelLoc: node.excelLoc,
          opasVersions: node.opasVersions,
          children: filteredChildren
        });
      });

      return result;
    }

    function buildExportObject(nodes, versionScope = "__ALL__") {
      let obj = {};
      nodes.forEach(node => {
        if (node.checked && nodeMatchesVersionScope(node, versionScope)) {
          if (node.children && node.children.length > 0) {
            const isAnonymousArray = node.children.every(c => c.label === "" || (c.label.startsWith("[") && c.label.endsWith("]")));
            if (isAnonymousArray) {
              obj[node.label] = node.children.map(c => c.value);
            } else {
              const childObj = buildExportObject(node.children, versionScope);
              if (Object.keys(childObj).length > 0) {
                obj[node.label] = childObj;
              } else if (node.value !== undefined && node.value !== null && node.value !== "") {
                obj[node.label] = node.value;
              }
            }
          } else {
            obj[node.label] = (node.value !== undefined && node.value !== null && node.value !== "") ? node.value : null;
          }
        }
      });
      return obj;
    }

    function updateOutputFromTree() {
      if (isPaneHidden) return;
      isUpdatingFromTree = true;
      hideError();
      const file = getActiveFile();
      if (!file) {
          isUpdatingFromTree = false;
          return;
      }

      try {
        const processedNodes = filterTreeByProfile(file.treeData, selectedProfileFilter);
        const exportedData = buildExportObject(processedNodes, selectedVersionScope);

        if (file.format === 'yaml') {
          codeRawText = window.jsyaml ? jsyaml.dump(exportedData) : simpleYamlDump(exportedData);
        } else {
          codeRawText = JSON.stringify(exportedData, null, 2);
        }

        renderCodeWithHighlights(codeRawText, currentSearchQuery, activeMatchIndex);
      } catch (err) {
        console.error("Serialization error:", err);
      }

      setTimeout(() => {
        isUpdatingFromTree = false;
      }, 150); 
    }

    function handleCodeInput() {
      if (isUpdatingFromTree) return;

      const file = getActiveFile();
      if (!file) return;

      const codeContainer = document.getElementById("code-output");
      codeRawText = codeContainer.innerText || codeContainer.textContent;
      let parsedData = null;

      try {
        if (file.format === 'yaml') {
          parsedData = window.jsyaml ? jsyaml.load(codeRawText) : JSON.parse(codeRawText);
        } else {
          parsedData = JSON.parse(codeRawText);
        }

        hideError();

        if (typeof parsedData === 'object' && parsedData !== null) {
          file.treeData = objectToTreeData(parsedData, file.treeData);
          updateProfileDropdowns();
          refreshView();
        }
      } catch (e) {
        showError(e.message || "Invalid syntax format");
      }
    }

    function objectToTreeData(obj, existingTree = []) {
      const result = [];

      if (Array.isArray(obj)) {
        obj.forEach((val, index) => {
          const existingNode = existingTree && existingTree[index] ? existingTree[index] : null;
          const isObject = typeof val === 'object' && val !== null;

          result.push({
            id: existingNode ? existingNode.id : ("n_" + Math.random().toString(36).substr(2, 9)),
            label: "",
            value: !isObject ? val : null,
            checked: existingNode ? existingNode.checked : true,
            expanded: existingNode ? existingNode.expanded : false,
            excelLoc: existingNode ? existingNode.excelLoc : null,
            opasVersions: existingNode ? existingNode.opasVersions : { v1: true, v2: true, v3: true },
            children: isObject ? objectToTreeData(val, existingNode ? existingNode.children : []) : []
          });
        });
        return result;
      }

      for (let key in obj) {
        const cleanKey = key.trim();
        const existingNode = findNodeByLabel(existingTree, cleanKey);
        const val = obj[key];
        const isObjectOrArray = typeof val === 'object' && val !== null && (Array.isArray(val) ? val.length > 0 : Object.keys(val).length > 0);

        result.push({
          id: existingNode ? existingNode.id : ("n_" + Math.random().toString(36).substr(2, 9)),
          label: cleanKey,
          value: !isObjectOrArray ? (val !== undefined && val !== null ? val : null) : null,
          checked: existingNode ? existingNode.checked : true,
          expanded: existingNode ? existingNode.expanded : false,
          excelLoc: existingNode ? existingNode.excelLoc : null,
          opasVersions: existingNode ? existingNode.opasVersions : { v1: true, v2: true, v3: true },
          children: isObjectOrArray ? objectToTreeData(val, existingNode ? existingNode.children : []) : []
        });
      }

      return result;
    }

    function findNodeByLabel(nodes, label) {
      if (!nodes) return null;
      return nodes.find(n => n.label === label) || null;
    }

    function switchFormat(format, triggerUpdate = true) {
      const file = getActiveFile();
      if (file) file.format = format;

      document.getElementById("tab-yaml").classList.toggle("active", format === 'yaml');
      document.getElementById("tab-json").classList.toggle("active", format === 'json');
      if (triggerUpdate && !isPaneHidden) updateOutputFromTree();
    }

    function showError(msg) {
      const banner = document.getElementById("error-banner");
      document.getElementById("error-message").textContent = msg;
      banner.style.display = "flex";
    }

    function hideError() {
      document.getElementById("error-banner").style.display = "none";
    }

    function copyToClipboard() {
      navigator.clipboard.writeText(codeRawText).then(() => alert("Copied to clipboard!"));
    }

    function downloadFile() {
      const file = getActiveFile();
      const blob = new Blob([codeRawText], { type: "text/plain;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = file ? file.name : `tree-data.${file ? file.format : 'yaml'}`;
      link.click();
    }
  </script>
</body>
</html>
