<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TreeData Navigator - O-PAS Edition</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

  <style>
    :root {
      --bg-dark: #ffffff;
      --bg-panel: #f8fafc;
      --bg-card: #f1f5f9;
      --bg-hover: #e2e8f0;
      --border-color: #cbd5e1;
      --accent-primary: #10b981;
      --accent-primary-hover: #059669;
      --accent-btn-text: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --danger-red: #ef4444;
      --val-blue: #2563eb;
      --profile-yellow: #d97706;
      --tab-bar-bg: #f1f5f9;
      --code-text: #0f172a;
      --table-th-bg: #e2e8f0;
      --search-match-bg: #fef08a;
      --search-match-active: #f97316;
    }

    body.dark-theme {
      --bg-dark: #0b0f17;
      --bg-panel: #111827;
      --bg-card: #1f2937;
      --bg-hover: #1b2333;
      --border-color: #1f2937;
      --accent-primary: #10b981;
      --accent-primary-hover: #059669;
      --accent-btn-text: #0b0f17;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --danger-red: #ef4444;
      --val-blue: #60a5fa;
      --profile-yellow: #f59e0b;
      --tab-bar-bg: #111726;
      --code-text: #f3f4f6;
      --table-th-bg: #1f2937;
      --search-match-bg: rgba(234, 179, 8, 0.4);
      --search-match-active: rgba(249, 115, 22, 0.9);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header {
      height: 52px; background-color: var(--bg-panel); border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: flex-start; padding: 0 15px; gap: 10px; z-index: 1000;
    }
    header select, header input {
      background-color: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main);
      padding: 5px 9px; border-radius: 4px; font-size: 0.82rem; outline: none;
    }
    .toolbar-divider { height: 18px; width: 1px; background-color: var(--border-color); margin: 0 2px; }

    .dropdown-container { position: relative; display: inline-block; }
    .dropdown-menu {
      display: none; position: absolute; top: calc(100% + 6px); left: 0; background-color: var(--bg-panel);
      border: 1px solid var(--border-color); border-radius: 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 9999; min-width: 200px; padding: 6px 0;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; color: var(--text-main); font-size: 0.84rem; cursor: pointer; }
    .dropdown-item:hover { background-color: var(--bg-hover); color: var(--accent-primary); }

    .container { display: flex; flex: 1; height: calc(100vh - 52px); width: 100vw; position: relative; }
    .tree-panel { flex: 1; display: flex; flex-direction: column; padding: 20px 20px 0 20px; min-width: 220px; overflow: hidden; }

    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
    .panel-title { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .panel-title::before { content: ''; width: 8px; height: 8px; background-color: var(--accent-primary); border-radius: 50%; }

    .btn {
      background-color: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color);
      padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { background-color: var(--bg-hover); }
    .btn-green { background-color: var(--accent-primary); color: #fff; border: none; font-weight: 600; }
    .btn-green:hover { background-color: var(--accent-primary-hover); }

    .search-bar { position: relative; margin-bottom: 10px; }
    .search-bar i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem; }
    .search-input {
      width: 100%; background-color: var(--bg-panel); border: 1px solid var(--border-color);
      padding: 8px 12px 8px 36px; border-radius: 6px; color: var(--text-main); outline: none; font-size: 0.9rem;
    }
    .tree-actions { display: flex; gap: 15px; margin-bottom: 10px; align-items: center; }
    .action-link { color: var(--text-muted); font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .action-link:hover { color: var(--text-main); }

    .tree-viewport { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
    .tree-virtual-spacer { width: 100%; position: absolute; top: 0; left: 0; pointer-events: none; }
    .tree-virtual-content { position: absolute; top: 0; left: 0; right: 0; }

    .virtual-row {
      height: 30px; display: flex; align-items: center; padding: 0 6px; border-radius: 4px; user-select: none; white-space: nowrap;
    }
    .virtual-row:hover { background-color: var(--bg-hover); }
    .toggle-icon { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); font-size: 0.72rem; flex-shrink: 0; }
    .toggle-icon.hidden-icon { visibility: hidden; }
    .folder-icon { color: var(--profile-yellow); margin-right: 5px; font-size: 0.85rem; flex-shrink: 0; }
    .node-label { font-size: 0.9rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; max-width: 45%; margin-left: 4px; }
    .node-label.folder-label { font-weight: 600; }
    .node-colon { color: var(--text-muted); font-size: 0.85rem; margin: 0 4px; flex-shrink: 0; }
    .node-value-input {
      background: transparent; border: 1px solid transparent; color: var(--val-blue); font-size: 0.85rem;
      font-family: monospace; outline: none; padding: 1px 6px; border-radius: 4px; flex: 1 1 0%; min-width: 60px;
      overflow: hidden; text-overflow: ellipsis; pointer-events: none;
    }
    body.edit-mode-active .node-value-input { pointer-events: auto; }
    body.edit-mode-active .node-value-input:focus { border-color: var(--border-color); background-color: var(--bg-dark); }

    .resizer-divider { width: 6px; background-color: var(--border-color); cursor: col-resize; flex-shrink: 0; }
    .output-panel { width: 50%; min-width: 25%; display: flex; flex-direction: column; background-color: var(--bg-panel); overflow: hidden; }
    .output-panel.hidden-pane { display: none !important; }
    .output-toolbar { padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
    .tab-group { background-color: var(--bg-dark); padding: 3px; border-radius: 6px; display: flex; gap: 3px; border: 1px solid var(--border-color); }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 4px 12px; font-size: 0.8rem; font-weight: 600; border-radius: 4px; cursor: pointer; }
    .tab-btn.active { background-color: var(--accent-primary); color: #fff; }
    .code-container { flex: 1; padding: 15px; overflow: hidden; display: flex; }
    #code-output { width: 100%; height: 100%; background: transparent; border: none; font-family: monospace; font-size: 0.92rem; outline: none; white-space: pre; overflow: auto; }

    #loading-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.25);
      backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; z-index: 9999; color: #fff; font-size: 1rem; gap: 10px;
    }
    #file-input { display: none; }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <i class="fa-solid fa-spinner fa-spin" style="font-size: 1.5rem;"></i>
    <span id="loading-message">Processing Workbook...</span>
  </div>

  <input type="file" id="file-input" multiple accept=".xlsx,.xls,.csv,.json,.yaml,.yml" onchange="handleFileSelect(event)">

  <header>
    <div class="dropdown-container">
      <button class="btn btn-green" onclick="toggleDropdownMenu(event)">
        <i class="fa-solid fa-file"></i> File <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem;"></i>
      </button>
      <div class="dropdown-menu" id="file-action-dropdown">
        <a class="dropdown-item" onclick="triggerFileInput(); closeDropdownMenu();"><i class="fa-solid fa-folder-open"></i> Open File(s)...</a>
        <a class="dropdown-item" onclick="saveExactPreservedExcelFile(); closeDropdownMenu();"><i class="fa-solid fa-floppy-disk"></i> Save Updated Excel</a>
      </div>
    </div>

    <div class="toolbar-divider"></div>
    <span style="font-size: 0.8rem; font-weight: 600;">View:</span>
    <select id="main-view-mode-select">
      <option value="tree_view">Tree</option>
    </select>

    <div class="toolbar-divider"></div>
    <span style="font-size: 0.8rem; color: var(--text-muted);">Profile:</span>
    <select id="view-profile-select" onchange="applyProfileFilter(this.value)">
      <option value="__ALL__">All</option>
      <option value="OSM-Redfish">OSM-Redfish</option>
      <option value="OSM-RedfishBMC">OSM-RedfishBMC</option>
      <option value="OSM-RedfishDCN">OSM-RedfishDCN</option>
    </select>

    <div class="toolbar-divider" style="margin-left: auto;"></div>
    <button class="btn" onclick="toggleDarkTheme()"><i class="fa-solid fa-moon"></i></button>
  </header>

  <div class="container" id="main-container">
    <div class="tree-panel">
      <div class="panel-header">
        <div class="panel-title">Tree Navigator</div>
        <div>
          <button class="btn btn-green" id="show-pane-resizer-btn" onclick="toggleOutputPane()"><i class="fa-solid fa-eye"></i> Show Pane</button>
        </div>
      </div>

      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" class="search-input" id="search-input" placeholder="Instant search..." oninput="handleSearchInput(this.value)">
      </div>

      <div class="tree-actions">
        <span class="action-link" onclick="expandAll()"><i class="fa-solid fa-bars-staggered"></i> Expand All</span>
        <span class="action-link" onclick="collapseAll()"><i class="fa-solid fa-bars"></i> Collapse All</span>
        <span id="row-count-badge" style="font-size: 0.78rem; color: var(--text-muted); margin-left: auto;"></span>
      </div>

      <div class="tree-viewport" id="virtual-tree-viewport" onscroll="handleVirtualScroll()">
        <div class="tree-virtual-spacer" id="virtual-tree-spacer"></div>
        <div class="tree-virtual-content" id="virtual-tree-content"></div>
      </div>
    </div>

    <div class="resizer-divider" id="drag-resizer"></div>

    <div class="output-panel hidden-pane" id="output-panel">
      <div class="output-toolbar">
        <div class="tab-group">
          <button class="tab-btn active" id="tab-yaml" onclick="switchFormat('yaml')">YAML</button>
          <button class="tab-btn" id="tab-json" onclick="switchFormat('json')">JSON</button>
        </div>
        <div>
          <button class="btn" onclick="copyToClipboard()"><i class="fa-regular fa-copy"></i> Copy</button>
          <button class="btn" onclick="toggleOutputPane()"><i class="fa-solid fa-eye-slash"></i> Hide</button>
        </div>
      </div>
      <div class="code-container">
        <div id="code-output"></div>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_EXCEL_FILENAME = "O-PAS-Redfish-Profile-Master.xlsx";
    const TARGET_SHEET_NAME = "Profile";

    let isPaneHidden = true;
    let selectedProfileFilter = "__ALL__";
    let codeRawText = "";
    let filesState = [];
    let activeFileId = null;
    const ROW_HEIGHT = 30;
    let virtualRowsList = [];

    document.addEventListener("DOMContentLoaded", () => {
      autoLoadDefaultExcelWorkbook();
    });

    async function autoLoadDefaultExcelWorkbook() {
      try {
        showLoading(true, "Loading Master Specification...");
        const rawFileUrl = "https://raw.githubusercontent.com/rund-aloraifi/tree/675a55ebd505066cd11a7a2a855183ae7f265923/O-PAS-Redfish-Profile-Master.xlsx";
        const response = await fetch(rawFileUrl);
        if (!response.ok) return;
        const buffer = await response.arrayBuffer();
        await parseAndOpenExcelBuffer(buffer, DEFAULT_EXCEL_FILENAME, TARGET_SHEET_NAME);
      } catch (err) {
        console.warn("Autoload skipped:", err);
      } finally {
        showLoading(false);
      }
    }

    function showLoading(show = true, msg = "Processing Workbook...") {
      const el = document.getElementById('loading-overlay');
      document.getElementById('loading-message').textContent = msg;
      el.style.display = show ? 'flex' : 'none';
    }

    function toggleDropdownMenu(e) { e.stopPropagation(); document.getElementById("file-action-dropdown").classList.toggle("show"); }
    function closeDropdownMenu() { document.getElementById("file-action-dropdown").classList.remove("show"); }
    window.addEventListener("click", () => closeDropdownMenu());

    function toggleDarkTheme() { document.body.classList.toggle("dark-theme"); }

    function toggleOutputPane() {
      const panel = document.getElementById("output-panel");
      isPaneHidden = !isPaneHidden;
      panel.classList.toggle("hidden-pane", isPaneHidden);
      if (!isPaneHidden) updateOutputFromTree();
    }

    function triggerFileInput() { document.getElementById("file-input").click(); }
    function handleFileSelect(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        await parseAndOpenExcelBuffer(e.target.result, files[0].name);
      };
      reader.readAsArrayBuffer(files[0]);
    }

    async function parseAndOpenExcelBuffer(buffer, fileName, preferredSheetName = null) {
      const zip = await JSZip.loadAsync(buffer);
      const workbookXml = await zip.file("xl/workbook.xml").async("string");
      const relsXml = await zip.file("xl/_rels/workbook.xml.rels").async("string");

      const parser = new DOMParser();
      const wbDoc = parser.parseFromString(workbookXml, "application/xml");
      const relsDoc = parser.parseFromString(relsXml, "application/xml");

      const sheets = wbDoc.getElementsByTagName("sheet");
      const rels = relsDoc.getElementsByTagName("Relationship");
      const relMap = {};
      for (let i = 0; i < rels.length; i++) relMap[rels[i].getAttribute("Id")] = "xl/" + rels[i].getAttribute("Target");

      const sheetMap = {};
      let firstSheetName = "";
      for (let i = 0; i < sheets.length; i++) {
        const name = sheets[i].getAttribute("name");
        const rId = sheets[i].getAttribute("r:id") || sheets[i].getAttribute("id");
        sheetMap[name] = relMap[rId];
        if (i === 0) firstSheetName = name;
      }

      let chosenSheetName = preferredSheetName && sheetMap[preferredSheetName] ? preferredSheetName : firstSheetName;
      const chosenSheetXmlPath = sheetMap[chosenSheetName];
      const xmlContent = await zip.file(chosenSheetXmlPath).async("string");

      let sharedStrings = [];
      const ssFile = zip.file("xl/sharedStrings.xml");
      if (ssFile) {
        const ssXml = await ssFile.async("string");
        const ssDoc = parser.parseFromString(ssXml, "application/xml");
        const siList = ssDoc.getElementsByTagName("si");
        for (let i = 0; i < siList.length; i++) {
          const tList = siList[i].getElementsByTagName("t");
          let txt = "";
          for (let j = 0; j < tList.length; j++) txt += tList[j].textContent || "";
          sharedStrings.push(txt);
        }
      }

      const tree = parseSheetXmlToTreeData(xmlContent, chosenSheetName, sharedStrings);
      filesState = [{ id: "f1", name: fileName, treeData: tree, format: "yaml" }];
      activeFileId = "f1";
      refreshVirtualTree();
    }

    function colLettersToIndex(letters) {
      let index = 0;
      for (let i = 0; i < letters.length; i++) index = index * 26 + (letters.charCodeAt(i) - 64);
      return index - 1;
    }

    function parseSheetXmlToTreeData(sheetXmlString, sheetName, sharedStrings = []) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(sheetXmlString, "application/xml");
      const rowElements = doc.getElementsByTagName("row");
      const rawRows = [];

      for (let r = 0; r < rowElements.length; r++) {
        const rowEl = rowElements[r];
        const rIndex = parseInt(rowEl.getAttribute("r")) - 1;
        const cellElements = rowEl.getElementsByTagName("c");
        const rowValues = [];
        const cellRefMap = [];

        for (let c = 0; c < cellElements.length; c++) {
          const cellEl = cellElements[c];
          const cellRef = cellEl.getAttribute("r");
          const colLetters = cellRef.replace(/[0-9]/g, '');
          const colIdx = colLettersToIndex(colLetters);
          const cellType = cellEl.getAttribute("t");

          let val = "";
          const vEl = cellEl.getElementsByTagName("v")[0];
          const isEl = cellEl.getElementsByTagName("is")[0];

          if (cellType === "s" && vEl) {
            val = sharedStrings[parseInt(vEl.textContent, 10)] || "";
          } else if (cellType === "inlineStr" && isEl) {
            val = isEl.textContent || "";
          } else if (vEl) {
            val = vEl.textContent || "";
          }

          rowValues[colIdx] = val;
          cellRefMap[colIdx] = cellRef;
        }

        rawRows[rIndex] = { values: rowValues, cellRefs: cellRefMap, xmlRow: rIndex + 1 };
      }

      window.rawRows = rawRows;
      return buildTreeFrom2DMatrix(rawRows, sheetName);
    }

    // =========================================================================
    // UNIVERSAL CLEAN PARSER ENGINE (مطابق 100% لبايثون)
    // =========================================================================
    function buildTreeFrom2DMatrix(rawRows, sheetName) {
      if (!rawRows || rawRows.length === 0) return [];
      let nodeCount = 0;

      function createNode(label, value = null, isFolder = false) {
        return {
          id: "n_" + (++nodeCount),
          label: String(label).trim(),
          value: value !== null ? String(value).trim() : null,
          checked: true,
          expanded: false,
          isFolder: isFolder,
          children: []
        };
      }

      function mapReq(code) {
        const c = String(code || "").trim().toUpperCase();
        if (c === 'M') return 'Mandatory';
        if (c === 'R') return 'Recommended';
        if (c === 'I') return 'IfImplemented';
        if (c === 'C') return 'Conditional';
        return 'None';
      }

      function attachProfiles(node, line) {
        const pDefs = [
          { name: "OSM-Redfish", r: mapReq(line[2]), w: mapReq(line[3]) },
          { name: "OSM-RedfishBMC", r: mapReq(line[4]), w: mapReq(line[5]) },
          { name: "OSM-RedfishDCN", r: mapReq(line[6]), w: mapReq(line[7]) }
        ];

        pDefs.forEach(p => {
          if (p.r !== 'None' || p.w !== 'None') {
            const pNode = createNode(p.name);
            if (p.r !== 'None') pNode.children.push(createNode("ReadRequirement", p.r));
            if (p.w !== 'None') pNode.children.push(createNode("WriteRequirement", p.w));
            node.children.push(pNode);
          }
        });
      }

      const rootNodes = [];
      const resourcesNode = createNode("Resources", null, false);
      rootNodes.push(resourcesNode);

      let i = 0;
      while (i < rawRows.length) {
        const rowObj = rawRows[i];
        if (!rowObj) { i++; continue; }
        const line = rowObj.values || [];
        const colA = String(line[0] || "").trim();
        const colB = String(line[1] || "").trim();

        let isResource = false;
        let resName = "";

        if (colA.startsWith("6.5.")) { resName = colB; isResource = !!resName; }
        else if (colA.startsWith("1.1.")) { resName = colA.replace(/^1\.1[.\w-]*\s*/, "").trim(); isResource = !!resName; }

        if (isResource && resName) {
          const resRoot = createNode(resName, null, false);
          resourcesNode.children.push(resRoot);

          let r = i + 1;
          let currentParentContainer = resRoot; // الأب الحاوي النشط

          while (r < rawRows.length) {
            const pObj = rawRows[r];
            if (!pObj) { r++; continue; }
            const pLine = pObj.values || [];
            const rawColA = String(pLine[0] || "");
            const trimmedColA = rawColA.trim();

            if (trimmedColA.startsWith("1.1.") || trimmedColA.startsWith("6.5.")) break;
            if (trimmedColA.toLowerCase() === "property" || trimmedColA.toLowerCase() === "(property)") { r++; continue; }

            if (trimmedColA) {
              const leadSpaces = rawColA.match(/^[\s\u00A0]*/)[0].length;
              const node = createNode(trimmedColA);
              attachProfiles(node, pLine);

              if (leadSpaces === 0) {
                // خاصية رئيسية (مثل MemoryLocation أو MemoryMedia)
                resRoot.children.push(node);
                currentParentContainer = node; // تثبيت هذا الكائن كأب لأي خصائص تتبعه وتحتوي على مسافات
              } else {
                // خاصية فرعية (مثل Channel, MemoryController, Slot, Socket)
                // تُضاف مباشرة كـ Sibling موازٍ تحت الحاوية المفتوحة حالياً (currentParentContainer)
                currentParentContainer.children.push(node);
              }
            }
            r++;
          }
          i = r - 1;
        }
        i++;
      }

      return rootNodes;
    }

    // =========================================================================
    // CLEAN VIRTUAL TREE FLATTENING (حل مشكلة الفلترة والعرض الشلالي)
    // =========================================================================
    function flattenVisibleNodes(nodes, profileFilter, searchTerm = "", currentDepth = 0) {
      let rows = [];

      nodes.forEach(node => {
        // إذا كان الفلتر محدد لبروفايل، وكان العقدة بروفايل آخر، نتخطاها
        if (["OSM-Redfish", "OSM-RedfishBMC", "OSM-RedfishDCN"].includes(node.label)) {
          if (profileFilter !== "__ALL__" && node.label !== profileFilter) return;
        }

        const hasChildren = node.children && node.children.length > 0;
        rows.push({
          id: node.id,
          label: node.label,
          value: node.value,
          depth: currentDepth,
          hasChildren: hasChildren,
          expanded: node.expanded,
          isFolder: node.isFolder
        });

        if (hasChildren && node.expanded) {
          rows = rows.concat(flattenVisibleNodes(node.children, profileFilter, searchTerm, currentDepth + 1));
        }
      });

      return rows;
    }

    function refreshVirtualTree() {
      const file = filesState[0];
      const spacer = document.getElementById("virtual-tree-spacer");
      const content = document.getElementById("virtual-tree-content");
      const badge = document.getElementById("row-count-badge");

      if (!file || !file.treeData) return;

      virtualRowsList = flattenVisibleNodes(file.treeData, selectedProfileFilter, "", 0);
      spacer.style.height = `${virtualRowsList.length * ROW_HEIGHT}px`;
      badge.textContent = `${virtualRowsList.length} nodes`;
      handleVirtualScroll();
    }

    function handleVirtualScroll() {
      const viewport = document.getElementById("virtual-tree-viewport");
      const content = document.getElementById("virtual-tree-content");
      if (virtualRowsList.length === 0) { content.innerHTML = ""; return; }

      const scrollTop = viewport.scrollTop;
      const startIndex = Math.max(0, Math.floor(scrollTop / ROW_HEIGHT) - 5);
      const endIndex = Math.min(virtualRowsList.length, Math.ceil((scrollTop + viewport.clientHeight) / ROW_HEIGHT) + 5);

      content.style.transform = `translateY(${startIndex * ROW_HEIGHT}px)`;

      let html = "";
      for (let i = startIndex; i < endIndex; i++) {
        const item = virtualRowsList[i];
        const paddingLeft = item.depth * 18 + 6;

        html += `
          <div class="virtual-row" style="padding-left: ${paddingLeft}px;">
            <span class="toggle-icon ${!item.hasChildren ? 'hidden-icon' : ''}" onclick="toggleExpand('${item.id}')">
              <i class="fa-solid ${item.expanded ? 'fa-chevron-down' : 'fa-chevron-right'}"></i>
            </span>
            <span class="node-label">${item.label}</span>
            ${item.value !== null ? `<span class="node-colon">:</span><span class="node-value-input">${item.value}</span>` : ''}
          </div>
        `;
      }
      content.innerHTML = html;
    }

    function toggleExpand(id) {
      function toggle(list) {
        for (let n of list) {
          if (n.id === id) { n.expanded = !n.expanded; return true; }
          if (n.children && toggle(n.children)) return true;
        }
        return false;
      }
      toggle(filesState[0].treeData);
      refreshVirtualTree();
    }

    function expandAll() {
      function exp(list, state) {
        list.forEach(n => { n.expanded = state; if (n.children) exp(n.children, state); });
      }
      exp(filesState[0].treeData, true);
      refreshVirtualTree();
    }

    function collapseAll() {
      function col(list) {
        list.forEach(n => { n.expanded = false; if (n.children) col(n.children); });
      }
      col(filesState[0].treeData);
      refreshVirtualTree();
    }

    function applyProfileFilter(val) {
      selectedProfileFilter = val;
      refreshVirtualTree();
    }

    function updateOutputFromTree() {
      const dump = simpleYamlDump(filesState[0].treeData);
      document.getElementById("code-output").textContent = dump;
    }

    function copyToClipboard() {
      navigator.clipboard.writeText(document.getElementById("code-output").textContent).then(() => alert("Copied!"));
    }
  </script>
</body>
</html>
